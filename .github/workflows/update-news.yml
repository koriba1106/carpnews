name: Update Carp News Feed

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: carp-news-updater
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl, simplexml, libxml, filter, intl
          ini-values: memory_limit=128M, expose_php=Off
          coverage: none

      - name: Run News Fetcher Script
        run: php carpnews_cron.php

      - name: Commit and Push if updated
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          rm -f data/cron.lock data/*.tmp*

          git add data/news.json
          if git diff --staged --quiet; then
            echo "ニュースの更新はありませんでした。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update Carp news feed [skip ci]"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
