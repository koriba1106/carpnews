<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 最高強度のCSP: インラインスクリプトや外部への不正通信・プラグイン実行を完全遮断 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';">
  <meta name="referrer" content="no-referrer">
  <title>広島東洋カープ ニュース速報ダッシュボード</title>
  <meta name="description" content="広島東洋カープの球団・監督・所属選手に関する最新ニュースを自動収集・リアルタイム分類する速報ダッシュボード">
  <link rel="stylesheet" href="carpnewsstyle.css?v=5.0">
  <script src="carpnews.js?v=5.0" defer></script>
</head>
<body>
  <div class="container">
    <header role="banner">
      <div class="header-meta">
        <h1 class="brand-title">広島東洋カープ ニュース速報</h1>
        <div class="sync-status" aria-live="polite">
          <span class="sync-dot" id="sync-dot"></span>
          <span id="sync-time">データ同期中...</span>
        </div>
      </div>
      <p class="brand-description">球団・首脳陣・所属選手に関する最新報道を自動監視・解析（類似記事の重複抑制済・最新100件）</p>
    </header>

    <!-- 統計サマリー -->
    <section class="summary-grid" aria-label="ニュース傾向統計">
      <div class="summary-card">
        <div class="summary-label">掲載総数</div>
        <div class="summary-value" id="stat-total">-</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">試合・戦評</div>
        <div class="summary-value" id="stat-game">-</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">公示・編成・契約</div>
        <div class="summary-value" id="stat-roster">-</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">24時間以内</div>
        <div class="summary-value" id="stat-recent">-</div>
      </div>
    </section>

    <!-- 操作パネル（検索・タグ絞り込み） -->
    <section class="control-deck" aria-label="データ絞り込み">
      <div class="search-field">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input type="search" id="search-input" placeholder="選手名・カテゴリ・メディア名で瞬時絞り込み (/ キーでフォーカス)" autocomplete="off" maxlength="100" aria-label="ニュース検索">
      </div>

      <div class="filter-row">
        <span class="filter-heading">表示</span>
        <div class="filter-chip-group" id="filter-all">
          <button type="button" class="chip active" data-type="all" data-value="ALL">すべて表示</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-heading">人物</span>
        <div class="filter-chip-group" id="filter-player"></div>
      </div>
      <div class="filter-row">
        <span class="filter-heading">分類</span>
        <div class="filter-chip-group" id="filter-category"></div>
      </div>
      <div class="filter-row">
        <span class="filter-heading">編成</span>
        <div class="filter-chip-group" id="filter-team"></div>
      </div>
    </section>

    <!-- ニュースフィード一覧 -->
    <main id="feed-container" class="feed-stream" role="feed" aria-busy="true">
      <div class="empty-placeholder">データを読み込んでいます...</div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
