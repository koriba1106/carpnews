<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 厳格なContent Security Policy (XSS・不正通信の遮断) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none';">
  <title>広島東洋カープ ニュース速報ダッシュボード</title>
  <meta name="description" content="広島東洋カープの球団・監督・所属選手に関する最新ニュースを自動収集・リアルタイム分類する速報ダッシュボード">
  <link rel="stylesheet" href="carpnewsstyle.css?v=4.0">
</head>
<body>
  <div class="container">
    <header role="banner">
      <div class="header-meta">
        <h1 class="brand-title">広島東洋カープ ニュース速報</h1>
        <div class="sync-status" aria-live="polite">
          <span class="sync-dot" id="sync-dot"></span>
          <span id="sync-time">データ同期中...</span>
        </div>
      </div>
      <p class="brand-description">球団・首脳陣・所属選手に関する最新報道を自動監視・解析（最新100件）</p>
    </header>

    <!-- 統計サマリー -->
    <section class="summary-grid" aria-label="ニュース傾向統計">
      <div class="summary-card">
        <div class="summary-label">掲載総数</div>
        <div class="summary-value" id="stat-total">-</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">試合・戦評</div>
        <div class="summary-value" id="stat-game">-</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">公示・編成・契約</div>
        <div class="summary-value" id="stat-roster">-</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">24時間以内</div>
        <div class="summary-value" id="stat-recent">-</div>
      </div>
    </section>

    <!-- 操作パネル（検索・タグ絞り込み） -->
    <section class="control-deck" aria-label="データ絞り込み">
      <div class="search-field">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input type="search" id="search-input" placeholder="選手名・カテゴリ・メディア名で瞬時絞り込み (/ キーでフォーカス)" autocomplete="off" maxlength="100">
      </div>

      <div class="filter-row">
        <span class="filter-heading">表示</span>
        <div class="filter-chip-group" id="filter-all">
          <button type="button" class="chip active" data-type="all" data-value="ALL">すべて表示</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-heading">人物</span>
        <div class="filter-chip-group" id="filter-player"></div>
      </div>
      <div class="filter-row">
        <span class="filter-heading">分類</span>
        <div class="filter-chip-group" id="filter-category"></div>
      </div>
      <div class="filter-row">
        <span class="filter-heading">編成</span>
        <div class="filter-chip-group" id="filter-team"></div>
      </div>
    </section>

    <!-- ニュースフィード一覧 -->
    <main id="feed-container" class="feed-stream" role="feed" aria-busy="true">
      <div class="empty-placeholder">データを読み込んでいます...</div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    'use strict';

    class AppState {
      constructor() {
        this.dataset = [];
        this.activeFilter = { type: 'all', value: 'ALL' };
        this.searchQuery = '';
      }

      setDataset(rawItems) {
        if (!Array.isArray(rawItems)) {
          this.dataset = [];
          return;
        }
        // スキーマ検証とサニタイズ
        this.dataset = rawItems
          .filter(item => item && typeof item === 'object')
          .map(item => ({
            id: typeof item.id === 'string' ? item.id : '',
            title: typeof item.title === 'string' ? item.title : '無題のニュース',
            link: this.sanitizeUrl(item.link),
            pubDate: typeof item.pubDate === 'string' && !Number.isNaN(Date.parse(item.pubDate))
              ? item.pubDate
              : new Date(0).toISOString(),
            source: typeof item.source === 'string' ? item.source : 'News',
            teamLevel: typeof item.teamLevel === 'string' ? item.teamLevel : null,
            players: Array.isArray(item.players) ? item.players.filter(p => typeof p === 'string') : [],
            categories: Array.isArray(item.categories) ? item.categories.filter(c => typeof c === 'string') : []
          }))
          .filter(item => item.link !== null);
      }

      sanitizeUrl(urlStr) {
        if (typeof urlStr !== 'string' || !urlStr.trim()) return null;
        try {
          const parsed = new URL(urlStr);
          if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
            return parsed.href;
          }
        } catch (_) {
          // Invalid URL
        }
        return null;
      }

      getFiltered() {
        const q = this.searchQuery.trim().toLowerCase();
        return this.dataset.filter(item => {
          if (this.activeFilter.type === 'player' && !item.players.includes(this.activeFilter.value)) return false;
          if (this.activeFilter.type === 'category' && !item.categories.includes(this.activeFilter.value)) return false;
          if (this.activeFilter.type === 'team' && item.teamLevel !== this.activeFilter.value) return false;

          if (q) {
            const textCorpus = [
              item.title,
              item.teamLevel,
              item.source,
              ...item.players,
              ...item.categories
            ].filter(Boolean).join(' ').toLowerCase();

            if (!textCorpus.includes(q)) return false;
          }
          return true;
        });
      }
    }

    const state = new AppState();
    let toastTimer = null;

    function isRecent(isoString) {
      const time = Date.parse(isoString);
      if (Number.isNaN(time)) return false;
      return (Date.now() - time) < 24 * 60 * 60 * 1000;
    }

    function formatTimestamp(isoString) {
      const d = new Date(isoString);
      if (Number.isNaN(d.getTime())) return '--/-- --:--';
      return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function notify(message) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          notify('記事URLをコピーしました');
          return;
        }
        // Fallback
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        notify('記事URLをコピーしました');
      } catch (_) {
        notify('URLのコピーに失敗しました');
      }
    }

    function updateStats() {
      document.getElementById('stat-total').textContent = String(state.dataset.length);
      document.getElementById('stat-game').textContent = String(
        state.dataset.filter(i => i.categories.includes('試合・戦評')).length
      );
      document.getElementById('stat-roster').textContent = String(
        state.dataset.filter(i => i.categories.includes('公示・登録抹消') || i.categories.includes('ドラフト・新戦力') || i.categories.includes('契約・編成')).length
      );
      document.getElementById('stat-recent').textContent = String(
        state.dataset.filter(i => isRecent(i.pubDate)).length
      );
    }

    function createBadge(text, className) {
      const span = document.createElement('span');
      span.className = `badge ${className}`;
      span.textContent = text;
      return span;
    }

    function renderFeed() {
      const container = document.getElementById('feed-container');
      const filtered = state.getFiltered();
      container.setAttribute('aria-busy', 'false');
      container.replaceChildren();

      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-placeholder';
        empty.textContent = '該当するニュースは見つかりませんでした。';
        container.appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();

      filtered.forEach(item => {
        const article = document.createElement('article');

        const cardLink = document.createElement('a');
        cardLink.href = item.link;
        cardLink.target = '_blank';
        cardLink.rel = 'noopener noreferrer';
        cardLink.className = 'feed-card';

        // 1行目: タグ一覧
        const rowTags = document.createElement('div');
        rowTags.className = 'card-row-tags';

        if (isRecent(item.pubDate)) {
          rowTags.appendChild(createBadge('NEW', 'badge-new'));
        }
        if (item.teamLevel) {
          rowTags.appendChild(createBadge(item.teamLevel, 'badge-team'));
        }
        item.players.forEach(player => {
          rowTags.appendChild(createBadge(`⚾ ${player}`, 'badge-player'));
        });
        item.categories.forEach(cat => {
          rowTags.appendChild(createBadge(cat, 'badge-category'));
        });

        // 2行目: タイトルとURL表示
        const rowTitleUrl = document.createElement('div');
        rowTitleUrl.className = 'card-row-title-url';

        const headline = document.createElement('h2');
        headline.className = 'card-headline';
        headline.textContent = item.title;

        const urlText = document.createElement('span');
        urlText.className = 'card-url-text';
        urlText.textContent = item.link;

        rowTitleUrl.appendChild(headline);
        rowTitleUrl.appendChild(urlText);

        // 3行目: メディア元・日時・共有ボタン
        const rowInfo = document.createElement('div');
        rowInfo.className = 'card-row-info';

        const metaLeft = document.createElement('div');
        metaLeft.className = 'card-meta-left';

        const timeEl = document.createElement('time');
        timeEl.className = 'card-timestamp';
        timeEl.setAttribute('datetime', item.pubDate);
        timeEl.textContent = formatTimestamp(item.pubDate);

        const sourceEl = document.createElement('span');
        sourceEl.className = 'card-source';
        sourceEl.textContent = item.source;

        metaLeft.appendChild(timeEl);
        metaLeft.appendChild(sourceEl);

        const shareBtn = document.createElement('button');
        shareBtn.type = 'button';
        shareBtn.className = 'btn-share';
        shareBtn.dataset.shareUrl = item.link;
        shareBtn.textContent = 'URL共有';

        rowInfo.appendChild(metaLeft);
        rowInfo.appendChild(shareBtn);

        cardLink.appendChild(rowTags);
        cardLink.appendChild(rowTitleUrl);
        cardLink.appendChild(rowInfo);
        article.appendChild(cardLink);
        fragment.appendChild(article);
      });

      container.appendChild(fragment);
    }

    function setupControls() {
      const playerCounts = {};
      const categoryCounts = {};
      const teamCounts = {};

      state.dataset.forEach(item => {
        if (item.teamLevel) {
          teamCounts[item.teamLevel] = (teamCounts[item.teamLevel] || 0) + 1;
        }
        item.players.forEach(p => {
          playerCounts[p] = (playerCounts[p] || 0) + 1;
        });
        item.categories.forEach(c => {
          categoryCounts[c] = (categoryCounts[c] || 0) + 1;
        });
      });

      const buildButtons = (containerId, counts, type) => {
        const container = document.getElementById(containerId);
        container.replaceChildren();
        const fragment = document.createDocumentFragment();

        Object.entries(counts)
          .sort((a, b) => b[1] - a[1])
          .forEach(([val, count]) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'chip';
            btn.dataset.type = type;
            btn.dataset.value = val;
            btn.textContent = `${val} (${count})`;
            fragment.appendChild(btn);
          });

        container.appendChild(fragment);
      };

      buildButtons('filter-player', playerCounts, 'player');
      buildButtons('filter-category', categoryCounts, 'category');
      buildButtons('filter-team', teamCounts, 'team');

      // フィルターボタンのイベント委譲
      document.querySelector('.control-deck').addEventListener('click', (e) => {
        const target = e.target.closest('.chip');
        if (!target) return;

        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        target.classList.add('active');

        state.activeFilter = {
          type: target.dataset.type || 'all',
          value: target.dataset.value || 'ALL'
        };
        renderFeed();
      });

      // URL共有ボタンのイベント委譲
      document.getElementById('feed-container').addEventListener('click', (e) => {
        const shareBtn = e.target.closest('.btn-share');
        if (!shareBtn) return;
        e.preventDefault();
        e.stopPropagation();
        const url = shareBtn.dataset.shareUrl;
        if (url) copyToClipboard(url);
      });

      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        renderFeed();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        }
      });
    }

    async function initialize() {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      try {
        const response = await fetch('./data/news.json?t=' + Date.now(), {
          signal: controller.signal,
          headers: { 'Accept': 'application/json' },
          cache: 'no-store'
        });
        clearTimeout(timeoutId);

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        state.setDataset(data);
        document.getElementById('sync-time').textContent = `LIVE: ${formatTimestamp(new Date().toISOString())}`;

        updateStats();
        setupControls();
        renderFeed();
      } catch (err) {
        clearTimeout(timeoutId);
        const syncDot = document.getElementById('sync-dot');
        if (syncDot) syncDot.classList.add('error');
        document.getElementById('sync-time').textContent = '同期エラー';

        const container = document.getElementById('feed-container');
        container.setAttribute('aria-busy', 'false');
        container.replaceChildren();
        const errDiv = document.createElement('div');
        errDiv.className = 'empty-placeholder';
        errDiv.textContent = 'ニュースデータの取得に失敗しました。CRONの実行状態または data/news.json の配置を確認してください。';
        container.appendChild(errDiv);
        console.error('[CarpNewsFeed Error]', err);
      }
    }

    document.addEventListener('DOMContentLoaded', initialize);
  </script>
</body>
</html>
